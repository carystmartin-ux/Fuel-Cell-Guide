<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuel Cell Build | Frankston Tech School</title>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: one step card at a time, sticky progress header, big thumb-friendly nav bar at the bottom for tablets */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --soft:#FFEEB9; --soft-ink:#3A2E00;
  --ink:#14254A; --muted:#4D5C7E; --line:#D6DDEC;
  --accent:#1B4298; --accent-ink:#FFFFFF; --accent-wash:#E9EEF8;
  --photo:#FFFFFF;
  --gas-h2:#B9C8EC; --gas-h2-dot:#1B4298; --gas-o2:#FFEEB9; --gas-o2-dot:#C9A227; --burper:#2E9B3E;
  --font:Arial, "Helvetica Neue", Helvetica, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1730; --surface:#132447; --soft:#3A3417; --soft-ink:#FFEEB9;
  --ink:#F1F4FB; --muted:#AAB6D2; --line:#2A3D68;
  --accent:#FFEEB9; --accent-ink:#14254A; --accent-wash:#1B305E; --photo:#FFFFFF; --gas-h2:#2F4F9A; --gas-h2-dot:#B9C8EC; --gas-o2:#5A4E1E; --gas-o2-dot:#FFEEB9; --burper:#4CC25E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1730; --surface:#132447; --soft:#3A3417; --soft-ink:#FFEEB9;
  --ink:#F1F4FB; --muted:#AAB6D2; --line:#2A3D68;
  --accent:#FFEEB9; --accent-ink:#14254A; --accent-wash:#1B305E; --photo:#FFFFFF; --gas-h2:#2F4F9A; --gas-h2-dot:#B9C8EC; --gas-o2:#5A4E1E; --gas-o2-dot:#FFEEB9; --burper:#4CC25E; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font)}
body{font-size:17px;line-height:1.5;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{padding-block:12px;display:grid;gap:8px}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.team{font-size:15px;color:var(--muted)}
.bar{height:10px;border-radius:5px;background:var(--accent-wash);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);width:0;transition:width .4s ease}
.progtext{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.ghost{font:inherit;font-size:14px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.ghost:hover{border-color:var(--accent)}

main .wrap{padding-block:20px;display:grid;gap:20px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(26px,5vw,34px);line-height:1.15;margin:4px 0 0;text-wrap:balance}
h2{font-size:18px;margin:0 0 8px}
b,strong{font-weight:700}

ol.do{margin:0;padding-left:1.4em;display:grid;gap:10px}
ol.do li{padding-left:4px}
.stop{border:3px solid var(--ink);border-radius:12px;padding:12px 14px;font-weight:700}
.stop small{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}

.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0}
.photos figure{margin:0;background:var(--photo);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:6px;align-content:start}
.photos img{display:block;width:100%;height:180px;object-fit:contain}
.photos.wide img{height:auto;max-height:340px}
.photos figcaption{font-size:14px;font-weight:700;color:#14254A;text-align:center}

.kit{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kit figure{margin:0;background:var(--photo);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:4px}
.kit img{width:100%;height:96px;object-fit:contain}
.kit figcaption{font-size:14px;font-weight:700;color:#14254A;text-align:center;line-height:1.25}
.kit figcaption span{display:block;font-weight:400;font-size:13px;color:#4D5C7E}

.checks{background:var(--accent-wash);border-radius:14px;padding:16px;display:grid;gap:10px}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--surface);border:2px solid var(--line);cursor:pointer;min-height:52px}
.check input{appearance:none;width:28px;height:28px;flex:none;border:3px solid var(--accent);border-radius:8px;margin:0;display:grid;place-content:center;cursor:pointer;background:var(--surface)}
.check input::after{content:"";width:12px;height:7px;border-left:4px solid var(--accent-ink);border-bottom:4px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.check input:checked{background:var(--accent)}
.check input:checked::after{opacity:1}
.check:has(input:checked){border-color:var(--accent)}
.check input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.quiz{border:2px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.quiz p{margin:0;font-weight:700}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:50px}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700}
.opt.wrong{text-decoration:line-through;opacity:.6}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.feedback{font-size:16px;padding:10px 12px;border-radius:10px;background:var(--soft);color:var(--soft-ink)}

.eureka{font:inherit;font-weight:700;font-size:clamp(28px,7vw,40px);letter-spacing:.04em;padding:22px;border-radius:16px;border:none;background:var(--soft);color:var(--soft-ink);cursor:pointer;width:100%}
.eureka:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.figure{margin:0;border:1px solid var(--line);border-radius:14px;padding:12px;overflow-x:auto}
.figure svg{display:block;width:100%;max-width:640px;height:auto;margin:0 auto}
.figure figcaption{font-size:15px;color:var(--muted);text-align:center;margin-top:8px}
.o2gas{transform-origin:303px 250px;animation:o2fill 8s ease-in-out infinite}
.h2gas{transform-origin:457px 250px;animation:h2fill 8s ease-in-out infinite}
.o2pl{animation:o2pl 8s ease-in-out infinite}
.h2pl{animation:h2pl 8s ease-in-out infinite}
@keyframes o2fill{0%,6%{transform:scaleX(0)}82%,94%{transform:scaleX(.5)}100%{transform:scaleX(0)}}
@keyframes h2fill{0%,6%{transform:scaleX(0)}82%,94%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes o2pl{0%,6%{transform:translateX(0)}82%,94%{transform:translateX(-68px)}100%{transform:translateX(0)}}
@keyframes h2pl{0%,6%{transform:translateX(0)}82%,94%{transform:translateX(135px)}100%{transform:translateX(0)}}
@media (prefers-reduced-motion: reduce){
  .o2gas{transform:scaleX(.5)} .h2gas{transform:scaleX(1)}
  .o2pl{transform:translateX(-68px)} .h2pl{transform:translateX(135px)} .bub{display:none}}
.plan{display:grid;gap:14px}
.plan h2{margin:0}
.prompt{display:grid;gap:4px;border:2px solid var(--line);border-radius:14px;padding:14px}
.prompt label{display:grid;gap:4px}
.pq{font-weight:700;font-size:18px}
.ph{color:var(--muted);font-size:16px}
.prompt textarea{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical;min-height:80px}
.prompt textarea:focus{outline:none;border-color:var(--accent)}
.field{display:grid;gap:6px}
.field input{font:inherit;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.field input:focus{outline:none;border-color:var(--accent)}
.need{margin:0;padding-left:1.2em;display:grid;gap:4px}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom .wrap{padding-block:12px;display:flex;gap:12px;align-items:center}
.btn{font:inherit;font-weight:700;font-size:18px;border-radius:12px;padding:14px 22px;cursor:pointer;border:2px solid var(--accent);min-height:56px}
.btn.back{background:var(--surface);color:var(--accent)}
.btn.next{flex:1;background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.ghost:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.hint{font-size:14px;color:var(--muted);text-align:center;margin:0}

/* Celebration overlay */
#hf{position:fixed;inset:0;z-index:20;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));text-align:center}
#hf .inner{display:grid;gap:18px;justify-items:center;max-width:620px;position:relative;z-index:2}
#hf .big{font-size:clamp(40px,10vw,72px);font-weight:700;line-height:1;margin:0}
#hf .milestone{font-size:20px;margin:0}
#hf .hands{display:flex;gap:clamp(16px,6vw,48px);flex-wrap:wrap;justify-content:center}
.hand{width:clamp(120px,30vw,170px);aspect-ratio:1;max-width:100%;border-radius:50%;border:4px solid var(--accent-ink);background:transparent;color:var(--accent-ink);cursor:pointer;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .12s}
.hand svg{width:62%;height:auto}
.hand.on{background:var(--accent-ink);color:var(--accent);transform:scale(1.06)}
.hand.flip svg{transform:scaleX(-1)}
.hand:focus-visible{outline:4px dashed var(--accent-ink);outline-offset:4px}
#hf .how{font-size:17px;margin:0;max-width:30em}
#hf .done{display:grid;gap:16px;justify-items:center}
#hf .go{font:inherit;font-weight:700;font-size:20px;padding:16px 30px;border-radius:12px;border:none;background:var(--accent-ink);color:var(--accent);cursor:pointer}
#hf .skip{font:inherit;font-size:15px;background:none;border:none;color:var(--accent-ink);text-decoration:underline;cursor:pointer}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="toprow">
    <div><div class="brand">Frankston Tech School · Fuel Cell Build</div><div class="team" id="teamLabel"></div></div>
    <button class="ghost" id="restartBtn" type="button">Start over</button>
  </div>
  <div class="bar" aria-hidden="true"><span id="barFill"></span></div>
  <div class="progtext" id="progText"></div>
</div></header>

<main><div class="wrap" id="stage"></div></main>

<nav class="bottom"><div class="wrap">
  <button class="btn back" id="backBtn" type="button">Back</button>
  <button class="btn next" id="nextBtn" type="button">Next</button>
</div></nav>

<div id="hf" hidden role="dialog" aria-modal="true" aria-labelledby="hfTitle">
  <canvas id="confetti"></canvas>
  <div class="inner">
    <p class="milestone" id="hfMilestone"></p>
    <p class="big" id="hfTitle">Team high five!</p>
    <div id="hfPress">
      <div class="hands">
        <button class="hand" id="handA" type="button" aria-label="Partner one high five"></button>
        <button class="hand flip" id="handB" type="button" aria-label="Partner two high five"></button>
      </div>
      <p class="how" style="margin-top:16px">Two of you press a hand at the same time to unlock the next part.</p>
      <button class="skip" id="hfSkip" type="button">Working solo? Tap here</button>
    </div>
    <div class="done" id="hfDone" hidden>
      <p class="how" id="hfNext"></p>
      <button class="go" id="hfGo" type="button">Keep going</button>
    </div>
  </div>
</div>

<text x="235" y="294" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="var(--ink)">Oxygen (O2)</text>
<text x="525" y="294" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="var(--ink)">Hydrogen (H2)</text>

 {part:"Set up the fuel cell", title:"Add the water",

const KEY="fts-fuelcell-assembly-v2";
let S={i:0,team:"",checks:{},quiz:{},tried:{}};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
if(S.i>=STEPS.length)S.i=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const stage=document.getElementById("stage");
const nextBtn=document.getElementById("nextBtn");
const backBtn=document.getElementById("backBtn");
const total=STEPS.length-1;

function esc(t){const d=document.createElement("div");d.textContent=t;return d.innerHTML}

function stepDone(i){
  const st=STEPS[i];const c=S.checks[i]||[];
  const allChecked=st.check.every((_,k)=>c[k]);
  const quizOk=!st.quiz||S.quiz[i]===st.quiz.a;
  const teamOk=!st.intro||S.team.trim().length>0;
  return allChecked&&quizOk&&teamOk;
}

function photosHTML(list){
  const wide=list.length===1&&list[0].wide;
  return `<div class="photos${wide?" wide":""}">${list.map(p=>`<figure><img src="${p.src}" alt="${esc(p.cap)}" loading="lazy"><figcaption>${esc(p.cap)}</figcaption></figure>`).join("")}</div>`;
}

  }
  const c=S.checks[S.i]||[];
  h+=`<div class="checks"><h2>Check it together</h2>${st.check.map((t,k)=>`<label class="check" for="c${S.i}_${k}"><input type="checkbox" id="c${S.i}_${k}" data-chk="${k}" ${c[k]?"checked":""}><span>${esc(t)}</span></label>`).join("")}</div>`;
  h+=`<p class="hint" id="gateHint"></p>`;
  stage.innerHTML=h;

  const tn=document.getElementById("teamName");
  if(tn) tn.addEventListener("input",()=>{S.team=tn.value;save();updateChrome();});
  stage.querySelectorAll("[data-chk]").forEach(el=>el.addEventListener("change",()=>{
    const arr=S.checks[S.i]||[];arr[+el.dataset.chk]=el.checked;S.checks[S.i]=arr;save();updateChrome();}));
  stage.querySelectorAll("[data-opt]").forEach(el=>el.addEventListener("click",()=>{
    const k=+el.dataset.opt;S.tried=S.tried||{};S.tried[S.i]=S.tried[S.i]||[];
    if(!S.tried[S.i].includes(k))S.tried[S.i].push(k);
    if(k===st.quiz.a)S.quiz[S.i]=k;
    save();render();}));
  stage.querySelectorAll("[data-plan]").forEach(el=>el.addEventListener("input",()=>{
    S.plan=S.plan||{};const arr=S.plan[S.i]||[];arr[+el.dataset.plan]=el.value;S.plan[S.i]=arr;save();}));
  const eb=document.getElementById("eurekaBtn");
  if(eb) eb.addEventListener("click",()=>{
    const arr=S.checks[S.i]||[];arr[1]=true;S.checks[S.i]=arr;save();
    showOverlay({milestone:"Hydrogen is being made",title:"EUREKA!",next:"Keep watching. When the hydrogen syringe is full, move on.",simple:true});
  });
  updateChrome();
}

function updateChrome(){
  const done=STEPS.filter((_,i)=>i>0&&stepDone(i)).length;
  document.getElementById("barFill").style.width=(done/total*100)+"%";
  document.getElementById("progText").textContent=`${done} of ${total} steps checked off`;
  document.getElementById("teamLabel").textContent=S.team?`Team: ${S.team}`:"Add your team name to begin";
  backBtn.disabled=S.i===0;
  const ok=stepDone(S.i);
  nextBtn.disabled=!ok;
  const st=STEPS[S.i];
  nextBtn.textContent=S.i===STEPS.length-1?"Finish":(st.intro?"Start building":"Next step");
  const hint=document.getElementById("gateHint");
  if(hint) hint.textContent=ok?"":(st.intro&&!S.team.trim()?"Add a team name, then tick every box to go on.":(st.quiz&&S.quiz[S.i]!==st.quiz.a?"Answer the quick check and tick every box to go on.":"Tick every box to go on."));
}

function go(n){S.i=Math.max(0,Math.min(STEPS.length-1,n));save();render();window.scrollTo({top:0,behavior:"auto"});}

nextBtn.addEventListener("click",()=>{
  if(!stepDone(S.i))return;
  const st=STEPS[S.i];
  if(st.highfive) showOverlay(st.highfive);
  else go(S.i+1);
});
backBtn.addEventListener("click",()=>go(S.i-1));

let confirmArmed=false;
const rb=document.getElementById("restartBtn");
rb.addEventListener("click",()=>{
  if(!confirmArmed){confirmArmed=true;rb.textContent="Tap again to clear";setTimeout(()=>{confirmArmed=false;rb.textContent="Start over";},3000);return;}
  confirmArmed=false;rb.textContent="Start over";
  S={i:0,team:"",checks:{},quiz:{},tried:{},plan:{}};save();render();
});

/* Celebration overlay: two-hand high five, or a simple Eureka burst */
const hf=document.getElementById("hf"),hA=document.getElementById("handA"),hB=document.getElementById("handB");
const hfPress=document.getElementById("hfPress"),hfDone=document.getElementById("hfDone");
hA.innerHTML=HAND;hB.innerHTML=HAND;
let pressed={A:0,B:0},held={A:false,B:false},current=null;
function showOverlay(info){
  current=info;
  document.getElementById("hfMilestone").textContent=info.milestone;
  document.getElementById("hfTitle").textContent=info.title||"Team high five!";
  document.getElementById("hfNext").textContent=info.next;
  document.getElementById("hfGo").textContent=info.last?"Back to the start":"Keep going";
  pressed={A:0,B:0};held={A:false,B:false};hA.classList.remove("on");hB.classList.remove("on");
  hf.hidden=false;
  if(info.simple){hfPress.hidden=true;hfDone.hidden=false;document.getElementById("hfGo").focus();confetti();}
  else{hfPress.hidden=false;hfDone.hidden=true;hA.focus();}
}
function bindHand(el,k){
  const down=e=>{e.preventDefault();held[k]=true;pressed[k]=performance.now();el.classList.add("on");test();};
  const up=()=>{held[k]=false;setTimeout(()=>{if(!held[k])el.classList.remove("on")},500);};
  el.addEventListener("pointerdown",down);
  ["pointerup","pointercancel","pointerleave"].forEach(t=>el.addEventListener(t,up));
  el.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();pressed[k]=performance.now();el.classList.add("on");test();setTimeout(()=>el.classList.remove("on"),600);}});
}
bindHand(hA,"A");bindHand(hB,"B");
function test(){
  const both=(held.A&&held.B)||(pressed.A&&pressed.B&&Math.abs(pressed.A-pressed.B)<900);
  if(both) celebrate();
}
document.getElementById("hfSkip").addEventListener("click",celebrate);
function celebrate(){
  if(hfPress.hidden)return;
  document.getElementById("hfTitle").textContent="High five!";
  hfPress.hidden=true;hfDone.hidden=false;
  document.getElementById("hfGo").focus();
  confetti();
}
document.getElementById("hfGo").addEventListener("click",()=>{
  hf.hidden=true;stopConfetti();
  if(!current||current.simple){render();return;}
  if(current.last) go(0); else go(S.i+1);
});

const cv=document.getElementById("confetti");let raf=null;
function confetti(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const ctx=cv.getContext("2d");const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const cs=getComputedStyle(document.documentElement);
  const cols=[cs.getPropertyValue("--accent-ink").trim()||"#FFFFFF","#FFEEB9","#FFFFFF"];
  const P=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*80,y:H*0.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,w:6+Math.random()*8,h:4+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;
  const tick=()=>{ctx.clearRect(0,0,W,H);t++;
    P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
    if(t<220)raf=requestAnimationFrame(tick);else ctx.clearRect(0,0,W,H);};
  stopConfetti();tick();
}
function stopConfetti(){if(raf)cancelAnimationFrame(raf);raf=null;const ctx=cv.getContext("2d");ctx&&ctx.clearRect(0,0,cv.width,cv.height);}

render();
</script>
